name: Deploy Django na Locaweb

on:
  push:
    branches:
      - main  # Altere para master se for o nome da sua branch principal

jobs:
  deploy:
    name: Enviar arquivos via FTP
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: FTP Deploy Locaweb
      uses: locaweb/ftp-deploy@1.0.0
      with:
        host: ${{ secrets.HOST }}
        user: ${{ secrets.USER }}
        password: ${{ secrets.PASS }}
        localDir: "."             # Envia a raiz do seu projeto Django
        remoteDir: "public_html/" # Pasta padrão da sua aplicação na Locaweb
        forceSsl: false
